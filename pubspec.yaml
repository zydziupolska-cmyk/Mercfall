name: mercfall
description: "Mercfall — turowa gra o dowodzeniu kompanią najemników."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/menu.mp3
    - assets/audio/map.mp3
    - assets/audio/battle.mp3
    - assets/audio/village.mp3
    - assets/audio/siege.mp3